<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Live Call | VoiceGuard</title>

<link
    rel="stylesheet"
    href="/static/css/style.css"
>

<style>

    .dashboard {
        padding: 50px 0;
    }

    .call-card {
        background: white;
        border-radius: 20px;
        padding: 35px;
        border: 1px solid #e5e7eb;
    }

    .call-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
    }

    .live {
        font-weight: 800;
    }

    .waveform {
        height: 150px;
        background: #f1f3f7;
        border-radius: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 30px;
        overflow: hidden;
    }

    .wave-bars {
        display: flex;
        gap: 5px;
        align-items: center;
    }

    .bar {
        width: 5px;
        height: 40px;
        background: #111827;
        border-radius: 5px;
        animation: pulse 1s infinite alternate;
    }

    .bar:nth-child(2) {
        animation-delay: .1s;
    }

    .bar:nth-child(3) {
        animation-delay: .2s;
    }

    .bar:nth-child(4) {
        animation-delay: .3s;
    }

    .bar:nth-child(5) {
        animation-delay: .4s;
    }

    @keyframes pulse {

        from {
            transform: scaleY(.3);
        }

        to {
            transform: scaleY(1.7);
        }

    }

    .score {
        font-size: 64px;
        font-weight: 900;
        margin: 20px 0;
    }

    .meter {
        height: 18px;
        background: #e5e7eb;
        border-radius: 20px;
        overflow: hidden;
    }

    .meter-fill {
        height: 100%;
        width: 0%;
        transition: width .5s;
        background: #111827;
    }

    .result {
        margin-top: 30px;
        padding: 25px;
        border-radius: 15px;
    }

    .result.safe {
        background: #eaf8ef;
    }

    .result.warning {
        background: #fff7df;
    }

    .result.danger {
        background: #ffecec;
    }

    .result h2 {
        margin-bottom: 10px;
    }

    .status {
        color: #667085;
        margin-top: 15px;
    }

</style>
```

</head>

<body>

<header class="navbar">

```
<div class="logo">
    VoiceGuard
</div>

<div class="nav-status">
    LIVE DETECTION
</div>
```

</header>

<main class="container dashboard">

```
<div class="call-card">

    <div class="call-header">

        <div>

            <h1>
                Live Call Analysis
            </h1>

            <p class="status">
                Waiting for authorized audio stream...
            </p>

        </div>

        <div class="live">
            ● LIVE
        </div>

    </div>


    <div class="waveform">

        <div class="wave-bars">

            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>

        </div>

    </div>


    <p>
        AI Voice Probability
    </p>

    <div
        class="score"
        id="score"
    >
        0%
    </div>


    <div class="meter">

        <div
            class="meter-fill"
            id="meter"
        ></div>

    </div>


    <div
        class="result safe"
        id="result"
    >

        <h2 id="resultTitle">
            Waiting for audio
        </h2>

        <p id="resultMessage">
            Start an authorized live call stream
            to begin analysis.
        </p>

    </div>

</div>
```

</main>

<script>

function updateDetection(data) {

    const score =
        data.ai_probability || 0;

    document.getElementById(
        "score"
    ).innerText = score + "%";

    document.getElementById(
        "meter"
    ).style.width = score + "%";


    const result =
        document.getElementById(
            "result"
        );

    result.className =
        "result " + data.color;


    document.getElementById(
        "resultTitle"
    ).innerText =
        data.label;

    document.getElementById(
        "resultMessage"
    ).innerText =
        data.message;
}

</script>

</body>

</html>
